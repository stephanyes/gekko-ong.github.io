<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gekko Club Social</title>
    <script type="text/javascript">
      // Captura la ruta pedida al refrescar y la convierte en query param temporal
      var segmentCount = 1; // 1 porque tu proyecto usa la subruta /gekko-web/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.split('/').slice(1 + segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
